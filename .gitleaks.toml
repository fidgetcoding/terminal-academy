# .gitleaks.toml — extends gitleaks default rules

[extend]
useDefault = true

[[allowlists]]
description = "Publishable key still in git history from the removed Supabase login. It was public by design and its project no longer exists."
regexes = [
  'sb_publishable_lqtyf5uWjAqHQCxOr2LlXA_0vuRGalM',
]

[[allowlists]]
description = "PostHog project token for the usage counts. It's public by design: it can only send events, and every visitor's browser has it."
regexes = [
  'phc_nkB5qDsUnUyyHKkzGJbwNworNCBsar69d3DQbCiVZNbE',
]
